name: handle_hero
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#000000"
  image: assets/images/SplashScreen.png
  android: true
  ios: true
  android_gravity: fill  # заповнює весь екран, зберігаючи пропорції
  ios_content_mode: scaleToFill
  android_12:
    android_gravity: fill
    image: assets/images/SplashScreen.png




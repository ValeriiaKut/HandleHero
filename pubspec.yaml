name: handle_hero
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.3.0
  flutter_svg: ^2.2.4
  camera: ^0.12.0+2
  hand_detection: ^4.1.0
  flutter_litert: ^3.9.4
  image: ^4.8.0

hooks:
  user_defines:
    dartcv4:
      ios:
        generator: Ninja

flutter_launcher_icons:
  image_path: "assets/SplashScreen.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F1E4"
  adaptive_icon_foreground: "assets/SplashScreen.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F6F1E4"
  android: true
  ios: false

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model.tflite
  fonts:
    - family: PressStart2P
      fonts:
        - asset: fonts/PressStart2P-Regular.ttf




